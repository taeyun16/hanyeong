[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
hanyeong-core = { path = "crates/hanyeong-core" }
hanyeong-mac = { path = "crates/hanyeong-mac" }

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.test]
incremental = false
debug = "line-tables-only"
