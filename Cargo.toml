[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
# 빌드할 수 있는 가장 낮은 Rust(edition 2024 의 let 체인). Homebrew·cargo install 은 사용자의 Rust 로
# 빌드하므로 올리지 않는다. CI 의 MSRV 잡이 이 버전으로 빌드·테스트한다.
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
hanyeong-core = { path = "crates/hanyeong-core" }
hanyeong-mac = { path = "crates/hanyeong-mac" }

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.test]
incremental = false
debug = "line-tables-only"
