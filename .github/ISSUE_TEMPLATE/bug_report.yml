name: 버그 알리기
description: 전환이 안 되거나, 키보드·단축키가 이상하게 남았을 때
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 무엇을 했고, 무엇을 기대했고, 실제로 어떻게 됐는지 적어 주세요.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 버전
      placeholder: "예: macOS 27.2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 설치 방법
      options:
        - Homebrew
        - curl 설치 스크립트
        - cargo install
        - 소스에서 직접 빌드
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: hanyeong version 과 hanyeong status 출력
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 기록(~/Library/Logs/hanyeong.log 의 마지막 부분)
      render: text
